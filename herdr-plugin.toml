id = "herdr-picker"
name = "Herdr Picker"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Fuzzy-find and focus open workspaces and tabs"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Search workspaces, worktrees and tabs"
command = ["./target/release/herdr-picker", "open"]

[[panes]]
id = "picker"
title = "Workspaces and tabs"
placement = "popup"
width = "80%"
height = 22
command = ["./target/release/herdr-picker", "pick"]
