# Merge into your Herdr config. Do not replace the rest of your config.
[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "herdr-picker.open"
description = "Search workspaces, worktrees and tabs"

# Reliable terminal fallback: Herdr's configured prefix, then f.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-picker.open"
description = "Search workspaces, worktrees and tabs"
